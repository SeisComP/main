  <title
     id="title2">scevent main instance and secondary instance synchronizing event IDs over the REST API</title>
  <desc
     id="desc4">Two scevent processes, the main instance on host-a and the secondary instance on host-b, each consume origins from their own local origin pipeline. The secondary instance posts each new origin to the main instance's /api/1/try-to-associate?allocate endpoint and receives back an event ID, which is then used for local event creation. The main instance keeps its reservations in an in-memory cache and, when eventIDSync.db is configured, additionally in a persistent SQLite database that survives restarts. Configuration parameters appear next to the instance they belong to.</desc>
